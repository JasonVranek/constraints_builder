log_json = true
log_level = "info,rbuilder=debug"
redacted_telemetry_server_port = 60610
redacted_telemetry_server_ip = "0.0.0.0"
full_telemetry_server_port = 60600
full_telemetry_server_ip = "0.0.0.0"

# chain = "hoodi"
chain = "/tmp/genesis_data/reth-genesis.json"
# reth_datadir = "../../reth/data/reth"
reth_datadir = "/tmp/reth-data/execution-data"

coinbase_secret_key = "env:COINBASE_SECRET_KEY"
relay_secret_key = "5eae315483f028b5cdd5d1090ff0c7618b18737ea9bf3c35047189db22835c48"
optimistic_relay_secret_key = "5eae315483f028b5cdd5d1090ff0c7618b18737ea9bf3c35047189db22835c48"

# cl_node_url can be a single value, array of values, or passed by an environment variables with values separated with a comma
cl_node_url = "http://127.0.0.1:53039"
jsonrpc_server_ip = "0.0.0.0"

# Optional, if not set, mempool won't be used as a source of transactions.
# el_node_ipc_path = "/tmp/reth.ipc"
extra_data = "constraints test"

blocklist = "./crates/rbuilder/src/integration/test_data/blocklist.json"

ignore_cancellable_orders = true

# watchdog_timeout_sec = 600
# simulation_threads = 4

# Set this for custom chains to avoid querying the beacon client
genesis_fork_version = "0x10000038"

slot_delta_to_start_bidding_ms = -11000

sbundle_mergeable_signers = []
# live_builders = ["mp-ordering", "mgp-ordering", "parallel"]
live_builders = ["mgp-ordering"]

enabled_relays = ["test-relay"]

subsidy = "0.01"

root_hash_use_sparse_trie=true
root_hash_compare_sparse_trie=false

# For constraints client - URL of the constraints server to poll
constraint_server_url = "http://127.0.0.1:9998"

# Genesis timestamp for slot calculation (Hoodi testnet)
genesis_timestamp = 1742213400

[[relays]]
name = "test-relay"
# Same as constraints server port since it proxies
# Note the test-relay must set it's own port
# and the constraints server will forward requests
# url = "http://localhost:9998"
url = "http://127.0.0.1:9998"
mode = "full"
max_bid_eth = "0.05"

[[builders]]
name = "mgp-ordering"
algo = "ordering-builder"
discard_txs = true
sorting = "mev-gas-price"
failed_order_retries = 1
drop_failed_orders = true

